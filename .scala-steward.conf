updates.ignore = [
  { groupId = "org.scala-lang", artifactId = "scala-library", version = "3." }
]

updates.pin = [
  # Keep the consumer baseline on Scala 3.3, including when a newer LTS exists.
  # Prefix pins allow 3.3 patch releases; artifact names are matched exactly.
  { groupId = "org.scala-lang", artifactId = "scala3-compiler", version = "3.3." },
  { groupId = "org.scala-lang", artifactId = "scala3-library", version = "3.3." },
  # Cover both the cross-versioned and fully qualified Scala.js module names.
  { groupId = "org.scala-lang", artifactId = "scala3-library_sjs1", version = "3.3." },
  { groupId = "org.scala-lang", artifactId = "scala3-library_sjs1_3", version = "3.3." },
  # Native versions combine the Scala and Native versions, e.g. 3.3.8+0.5.12.
  { groupId = "org.scala-native", artifactId = "scala3lib", version = "3.3." }
]
